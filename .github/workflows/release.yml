name: release

on:
  push:
    tags:
      - "v*"

# Prevent two tag pushes racing on the same ref — keeps release artifacts
# deterministic and the GitHub Release creation single-writer.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Minimum scopes needed for: checkout, release creation, OIDC-backed
# attestation, and pushing the container image to ghcr.io.
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  # Re-run the full offline gate here so a tag cut on a green CI still gets
  # validated against the exact commit being released. Independent from
  # ci.yml (which only fires on push/PR to main) so there's no race.
  check:
    name: lint + typecheck + tests (release gate, bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        bun: [latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome check
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Tests
        run: bun test
      - name: Benchmark regression gate
        run: bun run bench

  release:
    name: build, package, sign, publish
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ -(rc|alpha|beta|pre|dev)[.0-9]* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi
          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "CHANGELOG.md missing; falling back to auto-generated notes" >&2
            echo "body=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Extract the block between `## [VERSION]` (or `## VERSION`) and the
          # next `## ` heading. Trailing newline trimmed.
          BODY=$(awk -v v="$VERSION" '
            BEGIN { found=0 }
            /^## / {
              if (found) exit;
              if ($0 ~ "\\[" v "\\]" || $0 ~ " " v "( |$)" ) { found=1; next }
            }
            { if (found) print }
          ' CHANGELOG.md)
          {
            echo "body<<CHANGELOG_EOF"
            printf '%s\n' "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Forge release (build + package + source bundle)
        run: bun run forge.ts release

      - name: Generate CycloneDX SBOM
        run: bun run forge.ts sbom --out target/SBOM.cyclonedx.json

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "target/packages/*.tar.gz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/packages/*.tar.gz
            target/packages/SHA256SUMS.txt
            target/SBOM.cyclonedx.json

  container:
    name: publish container to ghcr.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tags
        id: imgtags
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMG="ghcr.io/${REPO}"
          TAGS="${IMG}:${VERSION},${IMG}:${TAG}"
          if [[ ! "$VERSION" =~ - ]]; then
            TAGS="${TAGS},${IMG}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "img=$IMG"   >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.imgtags.outputs.tags }}
          provenance: true
          sbom: true
      - name: Attest container image provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.imgtags.outputs.img }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
