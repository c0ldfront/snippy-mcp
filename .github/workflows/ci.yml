name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    name: lint + typecheck + test (bun ${{ matrix.bun }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: [latest, canary]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Install
        run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome check
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Tests
        run: bun test
      - name: Forge build (smoke, native target only)
        # Full cross-compile is exercised by the release workflow on `v*` tags,
        # which uses bun-latest (guaranteed sidecar availability). Canary
        # builds don't publish cross-compile sidecars for every point version,
        # so the PR smoke only compiles the native runner target.
        run: bun run forge.ts build --profile=debug --only=linux-x64

  bench:
    name: benchmarks (regression guard)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Run benchmarks vs baseline (fail on >=20% p95 regression)
        run: bun run bench
